<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barrio Pizza - Control de Órdenes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans selection:bg-orange-500 selection:text-white">
    <div id="app" class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col">
            <div class="p-6">
                <h1 class="text-2xl font-bold text-orange-500 flex items-center gap-2">
                    <i data-lucide="pizza"></i> Barrio Pizza
                </h1>
                <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider font-semibold">Compras & Inventario</p>
            </div>
            
            <nav class="flex-1 px-4 space-y-2">
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all bg-orange-500/10 text-orange-500 font-medium">
                    <i data-lucide="layout-dashboard"></i> Tablero
                </button>
                <button onclick="switchTab('ordenes')" id="btn-ordenes" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-700 text-slate-300">
                    <i data-lucide="shopping-cart"></i> Órdenes (Editar)
                </button>
                <button onclick="switchTab('proveedores')" id="btn-proveedores" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-700 text-slate-300">
                    <i data-lucide="truck"></i> Por Proveedor
                </button>
                <button onclick="switchTab('redistribucion')" id="btn-redistribucion" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-700 text-slate-300">
                    <i data-lucide="arrow-left-right"></i> Redistribución
                </button>
